<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>注入管家（Prompt Governor）</title>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
  :root {
    --bg:#f5f6f8; --panel:#fff; --panel2:#f2f4f7; --border:#e3e6ea; --text:#1f2430;
    --muted:#7a828e; --accent:#3b82f6; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
    --chip:#eef1f5; --hover:#f0f3f7;
  }
  [data-theme="dark"] {
    --bg:#14161a; --panel:#1c1f26; --panel2:#232733; --border:#2b2f38; --text:#e6e9ef;
    --muted:#8b93a1; --accent:#4c8dff; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
    --chip:#262a33; --hover:#232733;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-size:13px;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap;
    background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; margin:0; white-space:nowrap; }
  .stat { color:var(--muted); font-size:12px; }
  .spacer { flex:1; }
  button { background:var(--chip); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12.5px; }
  button:hover { background:var(--hover); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ghost { background:transparent; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  select,input[type="text"],input[type="search"] { background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12.5px; max-width:100%; }
  .chip { background:var(--chip); border-radius:4px; padding:2px 6px; font-size:11px;
    color:var(--muted); white-space:nowrap; display:inline-block; }
  .chip.ok { color:var(--ok); }
  .chip.warn { color:var(--warn); }
  .chip.danger { color:var(--danger); }
  .chip[data-gtag] { cursor:pointer; }
  .chip[data-gtag]:hover { border:1px solid var(--danger); color:var(--danger); }

  nav.pnav { display:flex; gap:8px; padding:12px 16px 0; flex-wrap:wrap; }
  nav.pnav button { flex:0 0 auto; min-width:130px; padding:9px 16px; font-size:13.5px;
    border-radius:10px 10px 0 0; background:var(--chip); }
  nav.pnav button.active { background:var(--panel); border-color:var(--accent);
    color:var(--accent); font-weight:700; }

  main { flex:1; min-height:0; display:flex; }
  .page { display:none; flex:1; min-width:0; background:var(--panel);
    border-top:1px solid var(--border); margin:0 16px 16px; border-radius:0 0 10px 10px;
    padding:16px; overflow-y:auto; }
  .page.active { display:flex; gap:16px; }
  .page.col.active { display:block; }

  aside { width:290px; min-width:230px; display:flex; flex-direction:column; gap:8px; }
  .pane { flex:1; min-width:0; overflow-y:auto; }
  .list { display:flex; flex-direction:column; gap:3px; overflow-y:auto; }
  .item { padding:7px 9px; border-radius:6px; cursor:pointer; border:1px solid transparent;
    display:flex; gap:6px; align-items:center; overflow:hidden; }
  .item:hover { background:var(--hover); }
  .item.active { border-color:var(--accent); background:var(--hover); }
  .item .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }

  .card { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
  .card h3 { margin:0 0 10px; font-size:13.5px; }
  .card h3 .muted { font-weight:400; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  .muted { color:var(--muted); }
  .num { font-variant-numeric:tabular-nums; }
  .mono { font-family:Consolas,monospace; font-size:12px; }
  .empty { color:var(--muted); padding:14px 4px; line-height:1.8; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:12px; }
  .kpi { border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .kpi .k { color:var(--muted); font-size:11.5px; }
  .kpi .v { font-size:19px; font-weight:700; margin-top:3px; }
  .kv { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed var(--border); }
  .kv:last-child { border-bottom:none; }
  .kv .k { color:var(--muted); }

  label.switch { display:inline-flex; align-items:center; cursor:pointer; flex:0 0 auto; }
  label.switch input { appearance:none; width:34px; height:19px; margin:0; border-radius:10px;
    background:var(--chip); border:1px solid var(--border); position:relative; cursor:pointer; }
  label.switch input::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px;
    border-radius:50%; background:var(--muted); transition:.15s; }
  label.switch input:checked { background:var(--accent); border-color:var(--accent); }
  label.switch input:checked::after { left:17px; background:#fff; }
  label.switch input:disabled { opacity:.4; cursor:default; }
  .switch-off { color:var(--muted); width:34px; text-align:center; flex:0 0 auto; }

  .blockrow { border-bottom:1px dashed var(--border); padding:6px 0; }
  .blockrow:last-child { border-bottom:none; }
  .blockrow .tag { font-family:Consolas,monospace; font-size:12px; color:var(--accent); }
  .textbox summary { cursor:pointer; color:var(--muted); font-size:12px; }
  pre { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px;
    white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:320px; overflow:auto;
    font-family:Consolas,"Microsoft YaHei",monospace; margin:6px 0 0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  td.word { word-break:break-all; }

  .plugrow { display:flex; align-items:center; gap:8px; padding:5px 6px; border-bottom:1px dashed var(--border); }
  .plugrow:last-child { border-bottom:none; }
  .plugrow .pname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plugrow .pdesc { color:var(--muted); font-size:11px; flex:1; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .pluglist { max-height:420px; overflow-y:auto; }

  #askMask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; z-index:60; }
  #askMask.show { display:flex; }
  #askBox { background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:18px; width:min(460px,92vw); }
  #askMsg { margin-bottom:14px; line-height:1.7; white-space:pre-wrap; }
  #askBtns { display:flex; justify-content:flex-end; gap:8px; }

  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px);
    background:#000c; color:#fff; padding:9px 18px; border-radius:8px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:.2s; z-index:70; max-width:80%; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err { background:#b91c1caa; }
</style>
</head>
<body>
<header>
  <h1>🧭 注入管家</h1>
  <span class="chip" id="chipSwitch">加载中…</span>
  <span class="stat" id="stat">加载中…</span>
  <span class="spacer"></span>
  <button id="btnRefresh" class="primary">刷新</button>
</header>

<nav class="pnav">
  <button data-page="audit" class="active">① 注入审计</button>
  <button data-page="persona">② 人格卡</button>
  <button data-page="plugins">③ 插件开关</button>
  <button data-page="about">④ 说明</button>
</nav>

<main>
  <section class="page active" id="page-audit">
    <aside>
      <input type="search" id="sessionFilter" placeholder="搜索会话…" />
      <div class="list" id="sessionList"><div class="empty">加载中…</div></div>
    </aside>
    <div class="pane" id="detail">
      <div class="empty">左边选一个会话，就能看到它每轮到底被注入了什么。</div>
    </div>
  </section>

  <section class="page col" id="page-persona">
    <div id="personaBody"><div class="empty">加载中…</div></div>
  </section>

  <section class="page col" id="page-plugins">
    <div class="card">
      <h3>会话级插件开关 <span class="muted">（写 AstrBot 原生 session_plugin_config）</span></h3>
      <div class="row">
        <select id="pluginUmo" style="min-width:280px"><option value="">（选择会话）</option></select>
        <span class="muted" id="pluginHint">这里只列出有审计记录的会话；新会话先聊一句再刷新。</span>
      </div>
    </div>
    <div id="pluginBody"><div class="empty">先选一个会话。</div></div>
  </section>

  <section class="page col" id="page-about">
    <div id="aboutBody"></div>
  </section>
</main>

<div id="askMask">
  <div id="askBox">
    <div id="askMsg"></div>
    <div id="askBtns">
      <button id="askCancel">取消</button>
      <button id="askOk" class="primary">确定</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
var bridge = window.AstrBotPluginPage;
var $ = function (id) { return document.getElementById(id); };
var S = {
  page: "audit",
  overview: null,
  sessions: [],
  sel: "",
  blocks: [],
  trim: null,
  history: [],
  persona: null,
  pluginUmo: "",
  pluginData: null
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtChars(n) {
  n = Number(n) || 0;
  return n.toLocaleString("en-US");
}
function fmtTime(ts) {
  if (!ts) { return "-"; }
  var d = new Date(ts * 1000);
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function fmtDate(ts) {
  if (!ts) { return "-"; }
  var d = new Date(ts * 1000);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + fmtTime(ts);
}
function shortUmo(u) {
  var parts = String(u || "").split(":");
  return parts.length > 2 ? parts.slice(2).join(":") : String(u || "");
}
function toast(msg, isErr) {
  var t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.className = ""; }, 3000);
}
function errBox(err) {
  return '<div class="empty">接口出错：' + esc(String((err && err.message) || err)) +
    '<br/>确认插件已启用、面板接口已注册，再点右上角刷新。</div>';
}

var _askResolve = null;
function askConfirm(msg) {
  return new Promise(function (resolve) {
    _askResolve = resolve;
    $("askMsg").textContent = msg;
    $("askMask").classList.add("show");
  });
}
function closeAsk(val) {
  $("askMask").classList.remove("show");
  var r = _askResolve; _askResolve = null;
  if (r) { r(val); }
}
$("askOk").onclick = function () { closeAsk(true); };
$("askCancel").onclick = function () { closeAsk(false); };
$("askMask").onclick = function (e) { if (e.target.id === "askMask") { closeAsk(false); } };

function unwrap(r) {
  if (r && typeof r === "object") {
    if (r.status === "error") { throw new Error(r.message || r.error || "接口返回错误"); }
    if (r.error) { throw new Error(r.error); }
    if (r.status === "ok" && Object.prototype.hasOwnProperty.call(r, "data")) { return r.data; }
  }
  return r;
}
async function apiGet(ep, params) {
  try {
    if (!bridge || typeof bridge.apiGet !== "function") { throw new Error("宿主没有注入桥"); }
    return unwrap(await bridge.apiGet(ep, params || {}));
  } catch (e) {
    toast("接口出错：" + String((e && e.message) || e), true);
    throw e;
  }
}
async function apiPost(ep, body) {
  try {
    if (!bridge || typeof bridge.apiPost !== "function") { throw new Error("宿主没有注入桥"); }
    return unwrap(await bridge.apiPost(ep, body || {}));
  } catch (e) {
    toast("接口出错：" + String((e && e.message) || e), true);
    throw e;
  }
}
function applyTheme(ctx) {
  var dark = ctx && typeof ctx.isDark === "boolean" ? ctx.isDark : true;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}

// ---------------------------- 页签 ----------------------------
function showPage(page) {
  S.page = page;
  var btns = document.querySelectorAll("nav.pnav button");
  Array.prototype.forEach.call(btns, function (b) {
    b.className = b.getAttribute("data-page") === page ? "active" : "";
  });
  var pages = document.querySelectorAll(".page");
  Array.prototype.forEach.call(pages, function (p) {
    p.className = p.id === "page-" + page ? (page === "audit" ? "page active" : "page col active") : (page === "audit" ? "page" : "page col");
  });
  if (page === "persona") { loadPersona(); }
  if (page === "plugins") { loadPluginsTab(); }
  if (page === "about") { renderAbout(); }
}
// 页签按钮必须显式接线：曾经漏掉这一步，点哪儿都没反应
Array.prototype.forEach.call(document.querySelectorAll("nav.pnav button"), function (b) {
  b.onclick = function () { showPage(b.getAttribute("data-page")); };
});

// ---------------------------- 总览 ----------------------------
async function loadOverview() {
  var ov = await apiGet("overview", {});
  S.overview = ov;
  S.sessions = ov.sessions || [];
  renderHeader(ov);
  if (!S.sel && S.sessions.length) { S.sel = S.sessions[0].umo; }
  if (S.sel && !S.sessions.some(function (s) { return s.umo === S.sel; })) { S.sel = ""; }
  renderSessions();
  return ov;
}
function renderHeader(ov) {
  var cfg = ov.config || {};
  var counts = ov.counts || {};
  $("stat").textContent = (counts.sessions || 0) + " 个会话 · " + (counts.cards || 0) + " 份人格卡 · 全局摘除 " +
    (counts.global_rules || 0) + " 项 · 会话摘除 " + (counts.session_rules || 0) + " 项";
  var chip = $("chipSwitch");
  if (!cfg.enabled) { chip.textContent = "总开关：关"; chip.className = "chip warn"; }
  else if (cfg.persona_card_enabled) { chip.textContent = "人格卡模式：开"; chip.className = "chip ok"; }
  else { chip.textContent = "审计中"; chip.className = "chip"; }
  chip.title = "总开关 / 审计 / 摘除 / 人格卡都在插件配置页管理";
}
$("btnRefresh").onclick = async function () {
  try {
    await loadOverview();
    if (S.page === "audit" && S.sel) { await loadDetail(); }
    if (S.page === "persona") { await loadPersona(); }
    if (S.page === "plugins" && S.pluginUmo) { await loadPlugins(S.pluginUmo); }
    toast("已刷新");
  } catch (e) { /* toast 已提示 */ }
};

// ---------------------------- 会话列表 ----------------------------
function renderSessions() {
  var box = $("sessionList");
  var kw = String($("sessionFilter").value || "").toLowerCase();
  var items = S.sessions.filter(function (s) {
    return !kw || String(s.umo).toLowerCase().indexOf(kw) >= 0;
  });
  if (!items.length) {
    box.innerHTML = '<div class="empty">还没有审计记录。<br/>确认「审计」已开启，然后和机器人聊一句。</div>';
    return;
  }
  box.innerHTML = items.map(function (s) {
    var saved = (s.before_chars || 0) - (s.after_chars || 0);
    return '<div class="item' + (s.umo === S.sel ? " active" : "") + '" data-umo="' + esc(s.umo) + '">' +
      '<span class="name" title="' + esc(s.umo) + '">' + esc(shortUmo(s.umo)) + "</span>" +
      '<span class="chip">' + (s.turns || 0) + " 轮</span>" +
      (saved > 0 ? '<span class="chip ok">-' + fmtChars(saved) + "</span>" : "") +
      "</div>";
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll(".item"), function (el) {
    el.onclick = function () { selectSession(el.getAttribute("data-umo")); };
  });
}
$("sessionFilter").oninput = renderSessions;
function selectSession(umo) {
  S.sel = umo;
  renderSessions();
  loadDetail();
}

// ---------------------------- 审计明细 ----------------------------
async function loadDetail() {
  var pane = $("detail");
  if (!S.sel) {
    pane.innerHTML = '<div class="empty">左边选一个会话，就能看到它每轮到底被注入了什么。</div>';
    return;
  }
  pane.innerHTML = '<div class="empty">加载中…</div>';
  try {
    var results = await Promise.all([
      apiGet("blocks", { umo: S.sel, window: 20 }),
      apiGet("trim", { umo: S.sel, action: "get" }),
      apiGet("history", { umo: S.sel, limit: 10 })
    ]);
    S.blocks = results[0].blocks || [];
    S.trim = results[1];
    S.history = results[2].records || [];
    renderAudit();
  } catch (e) {
    pane.innerHTML = errBox(e);
  }
}
function kpi(label, value) {
  return '<div class="kpi"><div class="k">' + esc(label) + '</div><div class="v">' + value + "</div></div>";
}
function renderAudit() {
  var pane = $("detail");
  var last = S.history.length ? S.history[S.history.length - 1] : null;
  var globalTags = (S.trim && S.trim.global_tags) || [];
  var sessionTags = (S.trim && S.trim.session_tags) || [];
  var html = "";

  html += '<div class="card"><h3>会话 <span class="mono">' + esc(S.sel) + "</span></h3>";
  if (last) {
    var saved = (last.before_chars || 0) - (last.after_chars || 0);
    html += '<div class="grid">' +
      kpi("最近一轮 system 注入", fmtChars(last.before_chars) + " → " + fmtChars(last.after_chars) + " 字符") +
      kpi("本轮省下", '<span class="' + (saved > 0 ? "chip ok" : "muted") + '">' + fmtChars(saved) + " 字符</span>") +
      kpi("用户消息附加段", fmtChars(last.parts_chars) + " 字符") +
      kpi("注入块", (last.blocks || []).length + " 个") +
      "</div>";
    html += '<div class="row">' +
      '<span class="muted">时间 ' + esc(fmtDate(last.t)) + "</span>" +
      '<span class="muted">本轮摘除：' + (last.removed_tags && last.removed_tags.length ? esc(last.removed_tags.join("、")) : "无") + "</span>" +
      '<span class="muted">人格卡：' + (last.persona_card_used ? "已生效" : "未使用") + "</span>" +
      "</div>";
  } else {
    html += '<div class="empty">这个会话还没有审计记录（可能审计被关掉了，或消息还没触发过 LLM 请求）。</div>';
  }
  html += "</div>";

  html += '<div class="card"><h3>注入块明细 <span class="muted">（最近 20 轮聚合；开关 = 本会话每轮摘除）</span></h3>';
  if (!S.blocks.length) {
    html += '<div class="empty">暂无注入块 —— 要么没聊过，要么这轮确实没有带标记的注入。</div>';
  } else {
    html += S.blocks.map(blockRow).join("");
  }
  html += '<div class="row" style="margin-top:10px"><button id="clearSessionRules" class="ghost danger">清空本会话摘除规则</button>' +
    '<span class="muted">当前会话规则：' + (sessionTags.length ? esc(sessionTags.join("、")) : "无") + "</span></div>";
  html += "</div>";

  html += '<div class="card"><h3>全局摘除规则 <span class="muted">（对所有会话生效）</span></h3>' +
    '<div class="row">' +
    (globalTags.length
      ? globalTags.map(function (t) { return '<span class="chip ok" data-gtag="' + esc(t) + '" title="点击取消全局摘除">&lt;' + esc(t) + "&gt; ✕</span>"; }).join("")
      : '<span class="muted">暂无全局规则</span>') +
    "</div>" +
    '<div class="row"><input type="text" id="globalTag" placeholder="输入标记名，如 emotion_system" style="min-width:240px" />' +
    '<button id="globalAdd" class="primary">加入全局摘除</button>' +
    '<button id="globalClear" class="ghost danger">清空全局规则</button></div>' +
    '<div class="muted">三层检测全通道扫描：&lt;tag&gt; 标记块（5 个通道都扫）、无标记锚点（system_reminder / kb_result / 侧栏引文等）、基线 diff（插件直接 += 的裸文本）；agent 多轮由最下游钩子补记。&lt;safety_override&gt; 这类安全底线永远摘不掉。</div>' +
    "</div>";

  var recs = S.history.slice(-10).reverse();
  html += '<div class="card"><h3>最近 ' + recs.length + ' 轮注入体积</h3>';
  if (!recs.length) {
    html += '<div class="empty">暂无历史。</div>';
  } else {
    html += '<table><thead><tr><th>时间</th><th>system 注入</th><th>省下</th><th>附加段</th><th>块</th><th>摘除</th><th>人格卡</th></tr></thead><tbody>' +
      recs.map(function (r) {
        var d = (r.before_chars || 0) - (r.after_chars || 0);

function setPersonaStatus(text) {

}
async function generatePersonaCard(pid, btn) {
  if (!pid) { return; }
  if (!await askConfirm("调 AI 为「" + pid + "」生成人格卡？\n会调用一次模型，把人格整理成摘要 + 若干部分（行为举止、背景故事…）。")) {

  }
  var old = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "生成中…"; }

function bindPersona(box) {
  Array.prototype.forEach.call(box.querySelectorAll("[data-gen]"), function (el) {
    el.onclick = function () { generatePersonaCard(el.getAttribute("data-gen"), el); };
  });

    el.onclick = async function () {
      var pid = el.getAttribute("data-rebuild");
      if (!await askConfirm("清掉「" + pid + "」的人格档案缓存？\n下次对话或再点「生成人格卡」时会重新整理。")) { return; }
      try {
        var r = await apiPost("card_rebuild", { persona_id: pid });
        toast(r.count ? "已清掉缓存：" + pid : "本来就没有缓存：" + pid);
        await loadPersona();
        await loadOverview();
      } catch (e) { /* toast 已提示 */ }
    };
  });
  var all = $("personaRebuildAll");
  if (all) {
    all.onclick = async function () {
      if (!await askConfirm("清空全部人格档案？\n之后再点生成、或聊一句会重新整理。")) { return; }
      try {
        var r = await apiPost("card_rebuild", {});
        toast("已清掉 " + r.count + " 份缓存");
        await loadPersona();
        await loadOverview();
      } catch (e) { /* toast 已提示 */ }
    };
  }
  var genAll = $("personaGenerateAll");
  if (genAll) {
    genAll.onclick = async function () {
      var personas = (S.persona && S.persona.personas) || [];
      var targets = personas.filter(function (p) { return p.id && p.id !== "__inline__"; });
      if (!targets.length) { toast("人格池是空的", true); return; }
      if (!await askConfirm("为 " + targets.length + " 份人格逐个生成人格卡？\n每份调用一次模型，会花一会儿。")) { return; }
      genAll.disabled = true;
      var ok = 0, failed = [];
      for (var i = 0; i < targets.length; i++) {
        setPersonaStatus("(" + (i + 1) + "/" + targets.length + ") 正在生成 " + targets[i].id + "…");
        try {
          await apiPost("persona_generate", { persona_id: targets[i].id });
          ok++;
        } catch (e) {
          failed.push(targets[i].id);
        }
      }
      toast("生成完成：" + ok + " 份成功" + (failed.length ? "，" + failed.length + " 份失败" : ""));
      await loadPersona();
      await loadOverview();
    };
  }
}

function renderPlugins(data) {
  var plugins = data.plugins || [];
  var disabledSet = {};
  (data.disabled || []).forEach(function (n) { disabledSet[n] = true; });
  var html = "";
  if (data.writable === false) {
    html += '<div class="card"><div class="empty">' + esc(data.message || "当前版本不支持写会话插件开关") + "</div></div>";
  }

    html += '<div class="card"><div class="chip warn">白名单模式</div> <span class="muted">本会话存在 enabled_plugins 白名单，' +
      "只有名单内的插件会生效。面板只在停用/启用层面同步 disabled_plugins。</span></div>";
  }
  html += '<div class="card"><h3>开关 <span class="muted">（关 = 本会话不加载该插件，走原生 session_plugin_config）</span></h3>' +
    '<div class="row"><input type="search" id="pluginFilter" placeholder="过滤插件名…" style="min-width:220px" />' +
    '<button id="pluginAllOn" class="ghost">全部开启</button>' +
    '<button id="pluginAllOff" class="ghost danger">全部关闭（核心除外）</button>' +
    '<button id="pluginReset" class="ghost danger">清除本会话开关</button></div>' +
    '<div class="muted">核心/保留插件（reserved）不能关；带「钩子类」标记的插件，其 LLM 注入不受会话开关拦截，' +
    "要压它的注入请用「注入审计」里的摘除开关。</div>" +
    '<div class="pluglist" id="pluginList"></div></div>';
  return html;
}
function renderPluginRows(plugins, disabledSet, writable, keyword) {
  var kw = String(keyword || "").toLowerCase();
  var items = plugins.filter(function (p) {
    return !kw || p.name.toLowerCase().indexOf(kw) >= 0;
  });
  if (!items.length) { return '<div class="empty">没有匹配的插件。</div>'; }
  return items.map(function (p) {
    var on = !disabledSet[p.name];
    var canToggle = writable && !p.reserved;
    return '<div class="plugrow">' +
      '<label class="switch" title="' + (canToggle ? "开 = 本会话启用" : "核心插件，不可关闭") + '">' +
      '<input type="checkbox" data-plug="' + esc(p.name) + '"' +
      (on ? " checked" : "") + (canToggle ? "" : " disabled") + " /></label>" +
      '<span class="pname mono">' + esc(p.name) + "</span>" +
      (p.reserved ? '<span class="chip warn">核心</span>' : "") +
      (p.has_hooks ? '<span class="chip">钩子类</span>' : "") +
      '<span class="pdesc" title="' + esc(p.desc) + '">' + esc(p.desc) + "</span>" +
      '<span class="chip' + (on ? " ok" : " danger") + '">' + (on ? "开" : "关") + "</span>" +
      "</div>";
  }).join("");
}
function bindPlugins(box, data) {
  var disabledSet = {};
  (data.disabled || []).forEach(function (n) { disabledSet[n] = true; });
  var writable = data.writable !== false;
  var list = $("pluginList");
  if (list) { list.innerHTML = renderPluginRows(data.plugins || [], disabledSet, writable, ""); }
  function refresh() {
    var keyword = $("pluginFilter") ? $("pluginFilter").value : "";
    if (list) { list.innerHTML = renderPluginRows(data.plugins || [], disabledSet, writable, keyword); }
    bindRows();
  }
  function bindRows() {
    if (!list) { return; }
    Array.prototype.forEach.call(list.querySelectorAll("input[data-plug]"), function (el) {
      el.onchange = async function () {
        var name = el.getAttribute("data-plug");
        try {
          await apiPost("plugin_toggle", { action: "set", umo: data.umo, plugin: name, disable: !el.checked });
          if (el.checked) { delete disabledSet[name]; } else { disabledSet[name] = true; }
          toast((el.checked ? "已开启：" : "已关闭：") + name);
          await loadPlugins(data.umo);
        } catch (e) { el.checked = !el.checked; }
      };
    });
  }
  var filter = $("pluginFilter");
  if (filter) { filter.oninput = refresh; }
  bindRows();
  var allOn = $("pluginAllOn");
  var allOff = $("pluginAllOff");
  var reset = $("pluginReset");
  if (allOn) {
    allOn.onclick = async function () {
      if (!await askConfirm("开启本会话的全部插件？")) { return; }
      for (var i = 0; i < (data.disabled || []).length; i++) {
        try { await apiPost("plugin_toggle", { action: "set", umo: data.umo, plugin: data.disabled[i], disable: false }); } catch (e) { /* 继续 */ }
      }
      toast("已全部开启");
      await loadPlugins(data.umo);
    };
  }
  if (allOff) {
    allOff.onclick = async function () {
      if (!await askConfirm("关闭本会话所有非核心插件？\n它们的注入、handler、LLM 工具都会一起消失。")) { return; }
      var targets = (data.plugins || []).filter(function (p) { return !p.reserved && !disabledSet[p.name]; });
      for (var i = 0; i < targets.length; i++) {
        try { await apiPost("plugin_toggle", { action: "set", umo: data.umo, plugin: targets[i].name, disable: true }); } catch (e) { /* 继续 */ }
      }
      toast("已关闭 " + targets.length + " 个插件");
      await loadPlugins(data.umo);
    };
  }
  if (reset) {
    reset.onclick = async function () {
      if (!await askConfirm("清除本会话的插件开关？\n回到 AstrBot 默认（全部启用）。")) { return; }
      try {
        await apiPost("plugin_toggle", { action: "clear", umo: data.umo });
        toast("已清除本会话插件开关");
        await loadPlugins(data.umo);
      } catch (e) { /* toast 已提示 */ }
    };
  }
}

    "带标记的注入块可以按会话摘除。<br/>" +
    "钩子优先级：本插件 priority=+2000 先拍基线，priority=-2000 最后解析终态并执行摘除 / 人格卡，" +
    "所以看到的是别的插件注入完的真实结果。" +
    "</div></div>" +
    '<div class="card"><h3>运行状态</h3>' +
    '<div class="kv"><span class="k">总开关</span><span>' + flag(cfg.enabled) + "</span></div>" +
    '<div class="kv"><span class="k">审计</span><span>' + flag(cfg.audit_enabled) +
      ' <span class="muted">保留 ' + (cfg.history_limit || 0) + " 轮 / 会话</span></span></div>" +
    '<div class="kv"><span class="k">记录注入全文</span><span>' + flag(cfg.capture_content) + "</span></div>" +
    '<div class="kv"><span class="k">标记块摘除</span><span>' + flag(cfg.trim_enabled) + "</span></div>" +
    '<div class="kv"><span class="k">人格卡模式</span><span>' + flag(cfg.persona_card_enabled) +
      ' <span class="muted">上限 ' + (cfg.persona_card_max_chars || 0) + ' 字符</span></span></div>' +
    '<div class="kv"><span class="k">调试日志</span><span>' + flag(cfg.debug_log) + "</span></div>" +
    '<div class="kv"><span class="k">会话数 / 人格卡 / 全局规则</span><span>' +
      (counts.sessions || 0) + " / " + (counts.cards || 0) + " / " + (counts.global_rules || 0) + "</span></div>" +
    '<div class="kv"><span class="k">已加载插件</span><span>' + (counts.plugins || 0) + " 个</span></div>" +
    '<div class="kv"><span class="k">数据目录</span><span class="mono word">' + esc(ov.data_dir || "-") + "</span></div>" +
    '<div class="muted" style="margin-top:8px">开关都在「插件配置」页改，改完重载插件生效；本页只管看与摘除/重建。</div>' +
    "</div>" +
    '<div class="card"><h3>设计边界</h3>' +
    '<div class="muted" style="line-height:1.9">' +
    "· 不改 AstrBot 源码、不 monkey-patch 任何插件；摘除只作用于带 &lt;tag&gt; 标记的文本。<br/>" +
    "· &lt;safety_override&gt; 是安全底线，永远不允许摘除。<br/>" +
    "· 审计是纯读操作；人格卡压缩失败、摘除失败都会退回原样，不影响正常对话。<br/>" +
    "· 会话级插件开关走 AstrBot 原生 session_plugin_config，与官方「自定义规则」同构。<br/>" +
    "· 审计历史只在内存里，重载插件后清空；摘除规则与人格卡缓存在数据目录 rules.json。" +
    "</div></div>";
}

// ---------------------------- 启动 ----------------------------
(async function boot() {
  try {
    if (bridge && bridge.ready) {
      var ctx = await bridge.ready();
      applyTheme(ctx);
      if (bridge.onContext) { bridge.onContext(applyTheme); }
    }
  } catch (e) { /* 桥没就绪也继续尝试加载 */ }
  try {
    await loadOverview();
    if (S.sel) { await loadDetail(); }
  } catch (e) { /* toast 已提示 */ }
})();
</script>
</body>
</html>
